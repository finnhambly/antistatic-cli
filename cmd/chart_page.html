<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
/* The card's own background and rule colours (chart.html), around it. */
:root{--bg:#ffffff;--line:#e7e5e4}
@media (prefers-color-scheme:dark){:root{--bg:#1a1816;--line:#3a3633}}
html,body{margin:0;background:var(--bg)}
main{max-width:760px;margin:24px auto;padding:0 16px}
iframe{display:block;width:100%;height:320px;border:1px solid var(--line);background:transparent}
</style>
</head>
<body>
<main>
<iframe id="card" title="{{TITLE}}" sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox"></iframe>
</main>
<script>
// A stand-in for the chat app that draws Antistatic's cards (MCP Apps): the
// card, as the site serves it, gets this call's arguments and result, as a
// card in Claude or ChatGPT does. Nothing here calls the site.
(function () {
  var CARD = {{CARD}}, TOOL = {{TOOL}}, INPUT = {{INPUT}}, RESULT = {{RESULT}};
  var frame = document.getElementById("card");
  var dark = window.matchMedia("(prefers-color-scheme: dark)");
  function theme() { return dark.matches ? "dark" : "light"; }
  function send(m) { frame.contentWindow.postMessage(m, "*"); }
  function notify(method, params) { send({ jsonrpc: "2.0", method: method, params: params }); }
  window.addEventListener("message", function (e) {
    if (e.source !== frame.contentWindow) return;
    var m = e.data || {};
    if (m.method === "ui/initialize") {
      send({ jsonrpc: "2.0", id: m.id, result: {
        protocolVersion: (m.params && m.params.protocolVersion) || "2026-01-26",
        hostInfo: { name: "antistatic-cli", version: "1" },
        hostCapabilities: { openLinks: {} },
        hostContext: {
          theme: theme(), displayMode: "inline", availableDisplayModes: ["inline"], platform: "web",
          toolInfo: { tool: { name: TOOL, annotations: { readOnlyHint: true } } }
        }
      } });
    } else if (m.method === "ui/notifications/initialized") {
      notify("ui/notifications/tool-input", { arguments: INPUT });
      notify("ui/notifications/tool-result", RESULT);
    } else if (m.method === "ui/notifications/size-changed") {
      if (m.params && m.params.height > 0) frame.style.height = Math.ceil(m.params.height) + "px";
    } else if (m.method === "ui/open-link") {
      if (m.params && /^https?:/.test(m.params.url)) window.open(m.params.url, "_blank", "noopener");
      send({ jsonrpc: "2.0", id: m.id, result: {} });
    } else if (m.id != null && m.method) {
      // Its own tool calls: the card has what it needs in RESULT.
      send({ jsonrpc: "2.0", id: m.id, error: { code: -32601, message: "Not available here" } });
    }
  });
  dark.addEventListener("change", function () { notify("ui/notifications/host-context-changed", { theme: theme() }); });
  frame.srcdoc = CARD;
})();
</script>
</body>
</html>
